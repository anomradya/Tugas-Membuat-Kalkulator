
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="calculator">
        <div class="display">
            <div id="expression"></div>
            <div id="result">0</div>
        </div>

        <div class="buttons">
            <button class="function" data-action="clear">AC</button>
            <button class="function" data-action="sign">+/−</button>
            <button class="function" data-action="percent">%</button>
            <button class="operator" data-operator="/" aria-label="Divide">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="*" aria-label="Multiply">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="-" aria-label="Subtract">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operator="+" aria-label="Add">+</button>

            <button class="zero" data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="operator" data-action="equals">=</button>
        </div>
    </main>

</body>
</html>
